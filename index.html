<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Mijn Mapbox-kaart</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Plak hier je PUBLIEKE token (begint met pk.)
    mapboxgl.accessToken = 'pk.eyJ1IjoiYnVra2ktc2FuZG9yIiwiYSI6ImNtd2t1cTl4MjA1bmQzMHNmNWFzZGtrMHgifQ.eAlk8Y4kfziqqG32N6MXfA';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [20.37, 47.9],   // [lengtegraad, breedtegraad]
      zoom: 11
    });

    map.addControl(new mapboxgl.NavigationControl());

    map.on('load', () => {
      map.addSource('bukk', {
    type: 'geojson',
    data: './Bukk-Maraton-Kozep-2024.geojson'
});

map.addLayer({
    id: 'bukk-route',
    type: 'line',
    source: 'bukk',
    paint: {
        'line-color': '#ff6600',
        'line-width': 4
    }
});
      
    new mapboxgl.Marker()
      .setLngLat([20.37, 47.9])
      .setPopup(new mapboxgl.Popup().setText('Hallo, dit is mijn kaart!'))
      .addTo(map);
  </script>
</body>
</html>
